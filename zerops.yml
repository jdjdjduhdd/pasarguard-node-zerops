zerops:
  - setup: docker
    run:
      base: docker@latest

      prepareCommands:
        - docker image pull ghcr.io/jdjdjduhdd/pasarguard-node-zerops:latest

      start: >-
        docker run --rm --network=host
        -e NODE_HOST=0.0.0.0
        -e SERVICE_PORT=8080
        -e SERVICE_PROTOCOL=rest
        -e TLS_ENABLED=false
        -e API_KEY
        -e GENERATED_CONFIG_PATH=/var/lib/pg-node/generated
        -e PG_NODE_WG_HOST_ROUTING=false
        -v pg-node-data:/var/lib/pg-node
        ghcr.io/jdjdjduhdd/pasarguard-node-zerops:latest

      ports:
        - port: 8080
          httpSupport: true

        - port: 62050
          httpSupport: false

        - port: 8081
          httpSupport: false

        - port: 8082
          httpSupport: false

        - port: 8083
          httpSupport: false

        - port: 8084
          httpSupport: false

        - port: 8085
          httpSupport: false

        - port: 8086
          httpSupport: false

        - port: 8087
          httpSupport: false

        - port: 8088
          httpSupport: false

        - port: 8089
          httpSupport: false

        - port: 8090
          httpSupport: false

      healthCheck:
        httpGet:
          port: 8080
          path: /healthz
          
